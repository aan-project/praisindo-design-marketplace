<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Icons+Outlined&family=Material+Icons" media="print" onload="this.media='all'" />
    <style>
      /* LD-01: before the application is drawn the page is a skeleton of the shell; the application replaces it when it mounts. It sits outside the tokens (they are built by the application), so it keeps its own greys. */
      body{margin:0}
      #root>.boot,#app>.boot{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;background:var(--color-background-neutral-page,#fff)}
      .boot-s{display:flex;flex-direction:column;gap:16px;padding:16px;border-right:1px solid var(--color-border-neutral-subtle,#ececec)}
      .boot-m{display:flex;flex-direction:column;gap:16px;padding:24px 32px}
      .boot-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
      .bk{display:block;border-radius:8px;background:var(--color-surface-neutral-tertiary,#e8e8e8);animation:bkp 1.2s ease-in-out infinite}
      .bk-l{width:120px;height:32px}.bk-s{height:40px}.bk-r{height:32px}.bk-t{width:240px;height:32px}.bk-p{width:360px;max-width:100%;height:16px}.bk-c{height:120px}
      .boot-l{display:none}
      /* LD-02: the sign-in page has no sidebar: for the sign-in address (and, in a project with a session, when nobody is signed in) the skeleton is the two panels of the sign-in screen */
      #root>.boot.login,#app>.boot.login{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
      .boot.login .boot-s,.boot.login .boot-m{display:none}
      .boot.login .boot-l{display:contents}
      .boot-la{display:block;border-radius:0;min-height:100vh;background:var(--color-surface-neutral-tertiary,#e8e8e8);animation:bkp 1.2s ease-in-out infinite}
      .boot-lf{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;padding:48px 24px}
      .boot-lf>.bk{width:100%;max-width:400px}
      .bk-h{height:32px;max-width:200px!important}.bk-i{height:48px}.bk-b{height:48px}
      @keyframes bkp{50%{opacity:.45}}
      @media(prefers-reduced-motion:reduce){.bk{animation:none}}
      @media(prefers-reduced-motion:reduce){.boot-la{animation:none}}
      @media(max-width:640px){#root>.boot,#app>.boot,#root>.boot.login,#app>.boot.login{grid-template-columns:minmax(0,1fr)}.boot-s{display:none}.boot-m{padding:16px}.boot-g{grid-template-columns:minmax(0,1fr)}.boot-la{display:none}}
    </style>
    <!-- LD-01: icons are font ligatures; until the icon font is loaded every icon is a skeleton block (css/05-states.css, html[data-icons="wait"]), never the word of its ligature. The font stylesheets do not block the first paint. -->
    <script>
      (function () {
        var d = document.documentElement;
        d.dataset.icons = 'wait';
        function loaded() { return Array.prototype.some.call(document.fonts || [], function (f) { return String(f.family).replace(/["']/g, '') === 'Material Icons Outlined' && f.status === 'loaded'; }); }
        function ready() { if (loaded()) d.dataset.icons = 'ready'; }
        if (document.fonts) { document.fonts.load('16px "Material Icons Outlined"').then(ready, function () {}); document.fonts.ready.then(ready); document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', ready); setTimeout(function () { if (d.dataset.icons === 'wait') d.dataset.icons = 'failed'; }, 20000); } else d.dataset.icons = 'ready';
      })();
    </script>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-busy="true" aria-label="Loading"><aside class="boot-s"><i class="bk bk-l"></i><i class="bk bk-s"></i><i class="bk bk-r"></i><i class="bk bk-r"></i><i class="bk bk-r"></i><i class="bk bk-r"></i><i class="bk bk-r"></i><i class="bk bk-r"></i></aside><main class="boot-m"><i class="bk bk-t"></i><i class="bk bk-p"></i><div class="boot-g"><i class="bk bk-c"></i><i class="bk bk-c"></i><i class="bk bk-c"></i></div><i class="bk bk-c"></i></main><section class="boot-l"><i class="boot-la"></i><div class="boot-lf"><i class="bk bk-h"></i><i class="bk bk-p"></i><i class="bk bk-i"></i><i class="bk bk-i"></i><i class="bk bk-b"></i></div></section></div></div>
    <script>(function(){var b=document.querySelector("#root>.boot");if(b&&/^#\/login/.test(location.hash))b.classList.add("login")})()</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
